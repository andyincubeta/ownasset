{% extends "base.html" %}
{% block title %}ASSET PRICES{% endblock %}
{% block content %}
<div class="page-fill">
  <div class="panel">
    <div class="panel-title">ASSET END PRICES <span class="dim">NATIVE CCY · ALL ASSETS EVER HELD</span>
      <span class="spacer"></span>
      <label class="dim">DECIMALS</label>
      <select id="ap-dp">
        <option value="2" selected>2</option><option value="3">3</option>
        <option value="4">4</option><option value="6">6</option>
      </select>
      <label class="dim">DAYS</label>
      <select id="ap-days">
        <option value="0">ALL</option><option value="30">30</option>
        <option value="90" selected>90</option><option value="365">365</option>
      </select>
      <button class="mini primary" id="ap-csv">DOWNLOAD CSV</button>
    </div>
    <div class="tbl-wrap">
      <table class="tbl tbl-freeze1" id="tbl-ap"><thead></thead><tbody></tbody></table>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/asset_prices.js"></script>{% endblock %}
